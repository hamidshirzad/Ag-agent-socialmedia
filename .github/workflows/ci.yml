name: CI

# The repository had no workflow that ran on pull requests: .circleci/config.yml
# is the unmodified CircleCI template and never invoked lint, tests or the
# build. That is why a dependency rollback and a broken lockfile could reach
# main unnoticed. This is the authoritative gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A clean install, not `npm install`: this fails loudly if package.json
      # and package-lock.json drift apart, which is exactly how the Stripe
      # dependencies went missing from the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Runs `prebuild`, so the client-config validation gates the build.
      - name: Build
        run: npm run build

      # Full guard: rebuilds with fake canaries in every guarded variable and
      # byte-scans every emitted artifact.
      - name: Client-secret guard
        run: npm run test:client-secrets
